<!-- Stroke-only artwork: fill="none" everywhere. There is no area to extrude
     until the strokes are outlined, so this must be auto-outlined or rejected
     with a clear message — never silently produce an empty solid. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <path d="M20 20 H 80" fill="none" stroke="#111" stroke-width="4"/>
  <path d="M20 50 H 80" fill="none" stroke="#111" stroke-width="4"/>
  <path d="M20 80 H 80" fill="none" stroke="#111" stroke-width="4"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#111" stroke-width="3"/>
</svg>
